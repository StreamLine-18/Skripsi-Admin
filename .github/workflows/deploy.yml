name: Build and Deploy (Tagged)

on:
  push:
    tags:
      - "dev-*"
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  IMAGE_NAME: fipexdeveloper/neo-fipex-cms
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Inject env file for client
        run: |
          echo "${{ startsWith(github.ref_name, 'v') && secrets.PROD_ENV || secrets.DEV_ENV }}" > client/.env.local
          cat client/.env.local
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
  deploy-dev:
    if: startsWith(github.ref_name, 'dev-')
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DEV VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          port: ${{ secrets.DEV_VPS_PORT }}
          script: |
            cd ${{ secrets.DEV_PROJECT_PATH }}
            docker compose pull 
            docker compose up -d
  deploy-prod:
    if: startsWith(github.ref_name, 'v')
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to PROD VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          port: ${{ secrets.PROD_VPS_PORT }}
          script: |
            cd ${{ secrets.PROD_PROJECT_PATH }}
            docker compose pull 
            docker compose up -d
